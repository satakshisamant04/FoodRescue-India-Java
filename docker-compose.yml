services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aahar-setu-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persist the JSON database across container restarts
      - ./data:/app/data
